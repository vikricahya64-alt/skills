<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agen AI Google Cloud</title>
<style>
:root{--bg:#0b1220;--panel:#111c30;--panel2:#16233c;--accent:#38bdf8;--accent2:#818cf8;--text:#e5edf7;--muted:#8ea2bd;--ok:#34d399;--err:#fb7185;--line:#22324e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#0e2a4a 0%,var(--bg) 55%);color:var(--text);display:flex;flex-direction:column;height:100vh;height:100dvh}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--accent);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(56,189,248,.28)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{transition:transform .12s ease,opacity .15s ease,background .15s ease,color .15s ease,border-color .15s ease}
button:active:not(:disabled){transform:translateY(1px) scale(.98)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(17,28,48,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
header h1{font-size:15px;margin:0;line-height:1.1}
header .sub{font-size:11px;color:var(--muted)}
#status{margin-left:auto;font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:4px 12px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.mode-switch{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px}
.mode-btn{font-size:12px;border:none;background:transparent;color:var(--muted);border-radius:16px;padding:5px 12px;cursor:pointer}
.mode-btn:hover{color:var(--text);background:rgba(56,189,248,.08)}
.mode-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08121f;font-weight:600;box-shadow:0 2px 10px rgba(56,189,248,.35)}
#capPanel{max-width:760px;margin:10px auto 0;padding:0 12px;width:100%;display:flex;flex-direction:column;gap:8px}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cap h4{margin:0;font-size:13.5px;color:var(--text)}
.cap .ci{font-size:12px;color:var(--muted);margin:4px 0}
.cap .cb{font-size:11.5px;background:var(--panel2);border:1px solid var(--line);color:var(--accent);border-radius:10px;padding:3px 9px;cursor:pointer}
.cap .runRow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cap .runBtn{font-size:11.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08121f;border:none;border-radius:14px;padding:4px 10px;cursor:pointer;font-weight:600}
.cap .cb:hover{border-color:var(--accent)}
.cap pre{background:#0b1626;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;white-space:pre-wrap;max-height:260px;overflow:auto;margin:6px 0 0}
.step{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin:4px 0;word-break:break-word}
.step .tl{font-weight:600;color:var(--accent)}
.step.ok{border-color:#14532d;background:rgba(16,185,129,.08)}
.step.prog{border-color:#0e7490;background:rgba(14,116,144,.10)}
.step .progText{color:var(--accent);font-size:12px;font-style:italic}
.step .liveDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22d3ee;margin:0 6px;box-shadow:0 0 8px #22d3ee;animation:progPulse 1s ease-in-out infinite}
.step .liveLbl{font-size:10px;font-weight:700;color:#22d3ee;letter-spacing:.5px;margin-right:6px}
.progText.blink{animation:progBlink 1.2s ease-in-out infinite}
@keyframes progPulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes progBlink{0%,100%{opacity:1}50%{opacity:.45}}
.step.err{border-color:#7f1d1d;background:rgba(251,113,133,.08)}
.step .out{font-family:ui-monospace,monospace;background:#0b1626;padding:4px 6px;border-radius:6px;margin-top:4px;font-size:11.5px;white-space:pre-wrap}
.caprun{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(129,140,248,.12));border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:5px 12px;margin-top:8px;font-size:12.5px;font-weight:600}
.caprun .cdot{width:9px;height:9px;border-radius:50%;background:#22d3ee;box-shadow:0 0 8px #22d3ee;animation:progPulse 1s ease-in-out infinite}
.caprun.now{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(56,189,248,.22),rgba(129,140,248,.18));border:1px solid #22d3ee;color:#a5f3fc;font-size:13px}
#status.on{color:var(--ok)}#status.off{color:var(--err)}
#banner{display:none;margin:8px 12px 0;padding:10px 12px;border-radius:10px;background:#3a1522;border:1px solid #5b2233;color:var(--err);font-size:13px}
#chat{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
#hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 16px 8px;gap:6px;color:var(--muted)}
#hero .heroLogo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 10px 30px rgba(56,189,248,.35);margin-bottom:6px}
#hero h2{font-size:clamp(20px,4vw,28px);margin:0;color:var(--text);letter-spacing:-.02em}
#hero .heroSub{max-width:560px;margin:0 0 14px;font-size:14px;line-height:1.6}
#hero .heroSub strong{color:var(--accent)}
#heroChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
#heroChips .chip{border-radius:22px;padding:8px 14px}
.msg{display:flex;gap:8px;max-width:100%}
.msg .av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px}
.user .av{background:#0ea5e9}
.bot .av{background:linear-gradient(135deg,#334155,#475569)}
.bub{max-width:86%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.6;word-wrap:break-word;overflow-wrap:break-word}
.user{margin-left:auto}.user .bub{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;border-bottom-right-radius:4px}
.bot .bub{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub pre{background:#0b1626;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-size:12.5px;line-height:1.5;margin:8px 0}
.bub code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b1626;padding:1px 5px;border-radius:5px;font-size:12.5px}
.bub pre code{background:none;padding:0;display:block;white-space:pre}
.bub h3,.bub h4{font-size:13.5px;margin:10px 0 4px;color:var(--accent)}
.bub ul,.bub ol{margin:6px 0;padding-left:20px}
.bub li{margin:2px 0}
.bub a{color:var(--accent)}
.typing .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1.2s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.tagline{display:block;margin-top:8px;font-size:11px;color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.pill{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:2px 9px;color:var(--muted)}
.copyBtn{font-size:11px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:2px 8px;cursor:pointer}
.copyBtn:hover{color:var(--accent);border-color:var(--accent)}
.actionBar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.act{font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:3px 9px;cursor:pointer;transition:.15s}
.act:hover{border-color:var(--accent);color:var(--accent)}
.dlbtn{font-size:12px;background:var(--accent);border:none;color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;margin-top:8px;font-weight:600;transition:.15s}
.dlbtn:hover{opacity:.88}
.confirmOv{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:999}
.confirmBox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:420px;width:calc(100% - 40px);box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center}
.confirmBox h4{margin:0 0 8px;color:#fbbf24}
.confirmBox .ci{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.confirmBox .cfw{display:inline-block;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.45);color:#fbbf24;font-weight:800;border-radius:8px;padding:1px 8px;letter-spacing:2px}
.confirmBox input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;text-align:center;letter-spacing:1px;margin-bottom:12px;outline:none}
.confirmBox input:focus{border-color:var(--accent)}
.confirmBox .runRow{display:flex;gap:8px;justify-content:center}
.confirmBox .runBtn{background:var(--accent);border:none;color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px;transition:.15s}
.confirmBox .runBtn:disabled{opacity:.4;cursor:not-allowed}
.confirmBox .cb{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:13px}
.confirmBox .cb:hover{border-color:#f87171;color:#f87171}
.quickRow{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 4px;max-width:760px;margin:0 auto;width:100%}
.quick{font-size:11.5px;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:5px 11px;cursor:pointer}
.quick:hover{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:760px;margin:0 auto;padding:2px 12px 8px;width:100%}
.chip{font-size:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:6px 12px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
#files{display:flex;flex-wrap:wrap;gap:8px;max-width:760px;margin:0 auto;padding:8px 12px 0;width:100%}
.fchip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:5px 8px 5px 5px;font-size:12px;color:var(--muted);max-width:240px}
.fchip img{width:34px;height:34px;object-fit:cover;border-radius:8px;background:#0b1626}
.fchip .fi{width:34px;height:34px;border-radius:8px;background:#0b1626;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.fchip .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.fchip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px}
.fchip button:hover{color:var(--err)}
#drop{display:none;position:fixed;inset:0;z-index:50;background:rgba(11,18,32,.7);backdrop-filter:blur(2px);align-items:center;justify-content:center;border:3px dashed var(--accent);color:var(--accent);font-size:16px;pointer-events:none}
#drop.on{display:flex}
footer{background:rgba(17,28,48,.9);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;box-shadow:0 -8px 24px rgba(0,0,0,.25)}
#qbar{display:flex;gap:8px;max-width:760px;margin:0 auto;width:100%;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;transition:border-color .15s ease,box-shadow .15s ease}
#qbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
textarea#q{flex:1;resize:none;padding:7px 6px 7px 10px;border-radius:10px;border:none;background:transparent;color:var(--text);font-size:15px;font-family:inherit;line-height:1.4;max-height:140px;min-height:34px}
textarea#q:focus{outline:none}
#sendBtn{flex-shrink:0;width:42px;height:42px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08121f;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(56,189,248,.3)}
#sendBtn:hover:not(:disabled){opacity:.92;box-shadow:0 3px 14px rgba(56,189,248,.45)}
#pauseBtn{flex-shrink:0;width:40px;height:40px;border-radius:12px;border:1px solid #7f1d1d;background:#3a1522;color:var(--err);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#micBtn{flex-shrink:0;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#micBtn:hover{border-color:var(--accent);color:var(--accent)}
#micBtn.rec{background:#3a1522;border-color:var(--err);color:var(--err);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
#voiceBtn{flex-shrink:0;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#voiceBtn:hover{border-color:var(--accent);color:var(--accent)}
#voiceBtn.playing{background:#42321a;border-color:#f59e0b;color:#fbbf24;animation:pulse 1.2s infinite}
#pauseBtn:hover{background:#4c1d2d}
#sendBtn:disabled{opacity:.5}
#attBtn{flex-shrink:0;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#attBtn:hover{border-color:var(--accent);color:var(--accent)}
#keyBtn{flex-shrink:0;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#keyBtn:hover{border-color:#fbbf24;color:#fbbf24}
</style>
</head>
<body>
<header>
  <div class="logo">&#9729;&#65039;</div>
  <div>
    <h1>Agen AI Google Cloud</h1>
    <div class="sub" id="subtitle">Semua skill GCP &middot; diproses di cloud</div>
  </div>
  <div class="mode-switch" id="modeSwitch">
    <button class="mode-btn active" data-mode="auto">🎛 Auto</button>
    <button class="mode-btn" data-mode="chat">💬 Chat</button>
    <button class="mode-btn" data-mode="coder">⚡ Coder</button>
  </div>
  <span id="status">menghubungkan&hellip;</span>
</header>
<div id="banner"></div>
<div id="capPanel" style="display:none"></div>
<div id="hero">
  <div class="heroLogo">&#9729;&#65039;</div>
  <h2 id="heroTitle">Halo, mau bantu apa hari ini?</h2>
  <p class="heroSub">Tanyakan apa saja soal <strong>Google Cloud</strong>, minta <strong>di-build-kan APK/proyek</strong>, atau minta <strong>dibuatkan kode</strong>. Semua skill GCP digabung otomatis lewat <em>fusion</em> di cloud.</p>
  <div class="heroChips" id="heroChips">
    <button class="chip">🚀 Buat APK aplikasi Android editor foto video</button>
    <button class="chip">📦 Build &amp; compile project saya jadi APK + source lengkap</button>
    <button class="chip">🔐 Cara deploy aplikasi ke Cloud Run</button>
    <button class="chip">📊 Setup BigQuery untuk analitik</button>
    <button class="chip">🛡 Rekomendasi firewall GCP</button>
    <button class="chip">💬 Buat chatbot AI native app</button>
  </div>
</div>
<div id="chat"><div class="wrap" id="chatWrap"></div></div>
<div class="chips" id="chips">
  <button class="chip">Apa itu Google Cloud Storage?</button>
  <button class="chip">Cara deploy aplikasi ke Cloud Run</button>
  <button class="chip">Setup BigQuery untuk analitik</button>
  <button class="chip">Rekomendasi firewall GCP</button>
</div>
<div class="quickRow">
  <button class="quick" id="voiceChatBtn">🔊 Obrolan suara</button>
  <button class="quick" data-fn="clarify">🤔 Perjelas maksud saya</button>
  <button class="quick" data-fn="simplify">🪶 Mudahkan jawaban</button>
  <button class="quick" data-fn="summary">📌 Ringkas</button>
  <button class="quick" data-fn="example">🛠 Contoh implementasi</button>
  <button class="quick" data-fn="step">👣 Langkah demi langkah</button>
  <button class="quick" data-fn="deep">🔍 Lebih dalam</button>
</div>
<div id="files"></div>
<footer>
  <form id="qbar">
    <button type="button" id="micBtn" title="Input suara (convert suara ke teks)">🎤</button>
    <button type="button" id="attBtn" title="Lampirkan file/gambar">&#128206;</button>
    <button type="button" id="keyBtn" title="Atur kata kunci verifikasi">🔑</button>
    <textarea id="q" rows="1" placeholder="Tanya apa saja soal Google Cloud&hellip; (Enter kirim, Shift+Enter baris baru)"></textarea>
    <button type="button" id="pauseBtn" title="Jeda / hentikan proses" style="display:none">⏸</button>
    <button type="submit" id="sendBtn" title="Kirim">&#10148;</button>
  </form>
</footer>
<input type="file" id="fileInput" multiple accept=".csv,.json,.md,.log,.txt,.py,.js,.ts,.java,.kt,.go,.rs,.c,.cpp,.h,.sh,.sql,.html,.css,.xml,.yml,.yaml,.tf,image/*" style="display:none">
<div id="drop">Lepaskan file di sini</div>
<script>
var SID = 's-' + Math.random().toString(36).slice(2);
var files = [];
var lastZipB64 = '';
var busy = false;
function $(id){return document.getElementById(id);}
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
function showBanner(msg){var b=$('banner');b.textContent=msg;b.style.display=msg?'block':'none';}
function setStatus(t,cls){var s=$('status');s.textContent=t;s.className=cls||'';}
function addMsg(role,html){
  var wrap=$('chatWrap');
  var m=document.createElement('div');m.className='msg '+role;
  var av=document.createElement('div');av.className='av';av.textContent=(role==='user'?'🧑':'☁');
  var bub=document.createElement('div');bub.className='bub';bub.innerHTML=html;
  m.appendChild(av);m.appendChild(bub);
  wrap.appendChild(m);
  $('chat').scrollTop=$('chat').scrollHeight;
  return m;
}
function md(src){
  var s=esc(src);
  s=s.replace(/```[\s\S]*?```/g,function(m){
    var c=m.replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'');
    return '<pre><code>'+esc(c)+'</code></pre>';
  });
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/^### (.*)$/gm,'<h4>$1</h4>');
  s=s.replace(/^## (.*)$/gm,'<h4>$1</h4>');
  var lines=s.split('\n'),out=[],list=null;
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(/^\s*[-*] (.*)$/.test(l)){
      if(!list){list=document.createElement('ul');out.push(list);}
      var li=document.createElement('li');li.innerHTML=l.replace(/^\s*[-*] /,'');list.appendChild(li);
    }else if(/^\s*\d+\. (.*)$/.test(l)){
      if(!list||list.tagName!=='OL'){list=document.createElement('ol');out.push(list);}
      var li=document.createElement('li');li.innerHTML=l.replace(/^\s*\d+\. /,'');list.appendChild(li);
    }else{
      list=null;out.push(l);
    }
  }
  var h='';for(var j=0;j<out.length;j++){h+=(out[j]&&out[j].tagName?out[j].outerHTML:out[j]+'<br>');}
  return h;
}
function kindOf(name){
  name=(name||'').toLowerCase();
  if(name.endsWith('.csv'))return 'CSV';
  if(name.endsWith('.json'))return 'JSON';
  if(name.endsWith('.md'))return 'Markdown';
  if(name.endsWith('.log'))return 'Log';
  if(name.endsWith('.txt'))return 'Teks';
  if(/\.(png|jpe?g|webp|gif|bmp)$/.test(name))return 'Gambar';
  if(/\.(py|js|ts|java|kt|go|rs|c|cpp|h|sh|sql|html|css|xml|yml|yaml|tf)$/.test(name))return 'Kode';
  return 'File';
}
function readFile(f){
  return new Promise(function(resolve){
    var kind=kindOf(f.name);

function parseSSE(buf){
  // Parse blok SSE menjadi array {event,data}
  var out=[];
  var cur=null;
  var lines=buf.split("\n");
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(line==="" && cur){ out.push(cur); cur=null; continue; }
    if(line.startsWith("event:")){ if(!cur)cur={event:line.slice(6).trim(),data:[]}; else cur.event=line.slice(6).trim(); }
    else if(line.startsWith("data:")){ var d=line.slice(5).trim(); if(!cur){cur={event:"message",data:[]};} cur.data.push(d); }
  }
  if(cur) out.push(cur);
  return out.map(function(e){ var txt=e.data.join("\n"); try{return {event:e.event,data:JSON.parse(txt)};}catch(_){return {event:e.event,data:txt};} });
}
function streamRun(url, q, box, title, finishMeta, t, combo){
  var bodyExtra=combo?{combo:combo}:{};
  return new Promise(function(resolvePromise, rejectPromise){
    var statusEl=document.createElement('div');
    statusEl.className='step prog';
    statusEl.innerHTML='<span class="tl">'+title+'</span> <span class="liveDot"></span><span class="liveLbl">LIVE</span> <span class="progText">memulai…</span>';
    box.appendChild(statusEl);
    $('chat').scrollTop=$('chat').scrollHeight;
    var seenSteps=0;
    var finished=false;
    function setLive(msg){
      statusEl.querySelector('.liveLbl').textContent='● BERJALAN';
      var pt=statusEl.querySelector('.progText');
      pt.textContent=msg||'bekerja…';
      pt.classList.add('blink');
      $('chat').scrollTop=$('chat').scrollHeight;
    }
    function finishOk(d){
      if(finished)return; finished=true;
      if(t)t.remove();
      if(statusEl&&statusEl.parentNode)statusEl.parentNode.removeChild(statusEl);
      if(finishMeta&&d&&d.skill){
        var st2=document.createElement('div');st2.className='step ok';st2.innerHTML='<span class="tl">KEMAMPUAN</span> '+esc(d.skill.name);box.appendChild(st2);
      }
      lastAnswerText=(d&&d.answer)||'';
      lastZipB64=(d&&d.projectZip)||'';
      var ans=document.createElement('div');ans.style.marginTop='8px';
      ans.innerHTML=md(lastAnswerText||'(tidak ada hasil akhir)');
      box.appendChild(ans);
      addActionBtns(box, lastAnswerText);
      if(d&&d.canDownload){
        var dbtn=document.createElement('button');dbtn.className='dlbtn';dbtn.textContent='📦 Unduh Project (ZIP)';
        dbtn.onclick=function(){ downloadProjectZip(); };
        box.appendChild(dbtn);
      }
      $('chat').scrollTop=$('chat').scrollHeight;
      setStatus('selesai');
      resolvePromise(d||{});
    }
    function finishErr(err){
      if(finished)return; finished=true;
      if(t)t.remove();
      if(statusEl&&statusEl.parentNode)statusEl.parentNode.removeChild(statusEl);
      setStatus('error','off');
      rejectPromise(err||new Error('stream error'));
    }
    function handleEvent(ev){
      if(ev.event==='start'){
        var sk=ev.data&&ev.data.skill;
        var skArr=ev.data&&ev.data.skills;
        var label=sk||(skArr&&skArr.length?skArr.join(' · '):'');
        if(label){
          var b=document.createElement('div');b.className='caprun now';
          b.innerHTML='<span class="cdot"></span> Sedang berjalan: '+esc(label);
          box.appendChild(b);
          setStatus('⚡ '+label);
          $('chat').scrollTop=$('chat').scrollHeight;
        }
        setLive('mengaktifkan…'); return;
      }
      if(ev.event==='progress'){
        if(ev.data&&ev.data.msg)setLive(ev.data.msg);
        return;
      }
      if(ev.event==='step'){
        var st=ev.data;
        var e=document.createElement('div');e.className='step '+(st.ok?'ok':'err');
        var tbl=renderToolResult(st.brief||'');
        e.innerHTML='<span class="tl">#'+(seenSteps+1)+' '+esc(st.tool)+'</span> '+(st.ok?'✓':'✕')+(tbl?tbl:'<div class="out">'+esc((st.brief||st.error||'').slice(0,500))+'</div>');
        box.appendChild(e);seenSteps++;
        setLive(st.ok?('✅ '+st.tool+' selesai') : ('⚠️ '+st.tool+' gagal — mencari cara lain…'));
        return;
      }
      if(ev.event==='error'){ finishErr(new Error(ev.data&&ev.data.error||'stream error')); return; }
      if(ev.event==='done'){ finishOk(ev.data); return; }
    }
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(Object.assign({task:q,sessionId:SID,stream:true},bodyExtra)),signal:abortSignal()})
      .then(function(r){
        if(!r.ok||!r.body){
          return r.json().then(function(d){ finishErr(new Error(d&&d.error||'server error')); }, function(){ finishErr(new Error('server error')); });
        }
        var reader=r.body.getReader();
        var dec=new TextDecoder();
        var buf="";
        function pump(){
          return reader.read().then(function(res){
            if(res.done){ if(!finished)finishErr(new Error('stream berakhir tanpa hasil')); return; }
            buf+=dec.decode(res.value,{stream:true});
            var idx;
            while((idx=buf.indexOf("\n\n"))!==-1){
              var chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
              var evs=parseSSE(chunk);
              evs.forEach(handleEvent);
            }
            return pump();
          }).catch(function(err){ finishErr(err); });
        }
        return pump();
      })
      .catch(function(err){ finishErr(err); });
  });
}
function confirmRun(cmd,comboId,comboName){
  if(busy){ addMsg('bot','⏳ <strong>Masih ada kemampuan yang sedang berjalan.</strong> Tunggu sampai selesai sebelum menjalankan kemampuan lain.'); showBanner('Eksekusi diblokir: tunggu kemampuan berjalan selesai.'); return; }
  var word=LS('verifyWord');
  if(!word){
    verifyModal('🔑 Atur Kata Kunci Verifikasi','Simpan & Jalankan',function(w){
      LS('verifyWord',w);execCombo(cmd,comboId);
    });
    return;
  }
  var ov=document.createElement('div');ov.className='confirmOv';
  ov.innerHTML='<div class="confirmBox">'+
    '<h4>⚠️ Konfirmasi sebelum eksekusi</h4>'+
    '<div class="ci">'+(comboName?'🏷️ <b>'+esc(comboName)+'</b><br>':'')+'Kemampuan ini akan berjalan <b>nyata</b> di lingkungan. '+
    'Ketik kata kunci verifikasi milik Anda lalu klik Jalankan. '+
    '<a href="javascript:void(0)" id="cfChg" style="color:var(--accent)">🔑 ganti kata kunci</a></div>'+
    '<input type="text" id="cfWord" placeholder="Ketik kata kunci Anda…" autocomplete="off">'+
    '<div class="runRow"><button class="runBtn" id="cfGo" type="button" disabled>🚀 Jalankan Sekarang</button>'+
    '<button class="cb" id="cfX" type="button">Batal</button></div>'+
    '</div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector('#cfWord'),go=ov.querySelector('#cfGo');
  function matches(){return inp.value.trim()===word;}
  function chk(){go.disabled=!matches();}
  inp.addEventListener('input',chk);
  function killConfirm(){ if(ov.parentNode)ov.parentNode.removeChild(ov); }
  function goRun(){ if(matches()){ killConfirm(); execCombo(cmd,comboId); } }
  go.onclick=goRun;
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') goRun(); });
  ov.querySelector('#cfX').onclick=killConfirm;
  ov.querySelector('#cfChg').onclick=function(){ killConfirm(); verifyModal('🔑 Ganti Kata Kunci Verifikasi','Simpan',function(w){ LS('verifyWord',w); addMsg('bot','🔑 Kata kunci verifikasi diperbarui.'); }); };
  inp.focus();
}
function LS(k,v){
  try{
    if(v!==undefined){ localStorage.setItem(k,String(v)); return null; }
    var x=localStorage.getItem(k); return x==null?'':x;
  }catch(e){ return v!==undefined?null:''; }
}
function verifyModal(title,btnLabel,onOk){
  var ov=document.createElement('div');ov.className='confirmOv';
  ov.innerHTML='<div class="confirmBox">'+
    '<h4>'+title+'</h4>'+
    '<div class="ci">Kata kunci adalah <b>pilihan Anda</b> dan tersimpan hanya di browser ini. Kata kunci itu wajib diketik untuk menjalankan kemampuan dari panel. Minimal 3 karakter.</div>'+
    '<input type="text" id="kvInp" placeholder="Tentukan kata kunci Anda…" autocomplete="off">'+
    '<div class="runRow"><button class="runBtn" id="kvGo" type="button" disabled>'+btnLabel+'</button>'+
    '<button class="cb" id="kvX" type="button">Batal</button></div>'+
    '</div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector('#kvInp'),go=ov.querySelector('#kvGo');
  function valid(){return inp.value.trim().length>=3;}
  function chk(){go.disabled=!valid();}
  inp.addEventListener('input',chk);
  function rm(){ if(ov.parentNode)ov.parentNode.removeChild(ov); }
  function done(){ if(valid()){ var w=inp.value.trim(); rm(); onOk(w); } }
  go.onclick=done;
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') done(); });
  ov.querySelector('#kvX').onclick=rm;
  inp.focus();
}
function execCombo(q,combo){
  if(busy)return;
  q=String(q||'').trim();
  if(!q)return;
  var t=typing();busy=true;$('sendBtn').disabled=true;showPause();setStatus('🎯 menjalankan misi — ikuti progres di bawah&hellip;');
  var box=document.createElement('div');box.className='bub';box.innerHTML='<strong>🎯 Misi kemampuan:</strong>';
  $('chatWrap').appendChild(box);
  streamRun('/api/run',q,box,'▶ misi',true,t,combo)
    .catch(function(err){
      t.remove();
      addMsg('bot','⚠️ <strong>Error:</strong> '+esc((err&&err.message)||'server error'));
      showBanner('Single-command error. Coba lagi.');
      setStatus('error','off');
    })
    .finally(function(){busy=false;$('sendBtn').disabled=false;hidePause();abortCtrl=null;});
}
function sendRun(q){
  if(busy)return;
  q=String(q||'').trim();
  if(!q)return;
  $('q').value='';autoGrow();hideHero();
  addMsg('user',esc(q));
  var t=typing();busy=true;$('sendBtn').disabled=true;showPause();setStatus('🎯 menjalankan misi — ikuti progres di bawah&hellip;');
  var box=document.createElement('div');box.className='bub';box.innerHTML='<strong>🎯 Misi kemampuan:</strong>';
  $('chatWrap').appendChild(box);
  streamRun('/api/run',q,box,'▶ misi',true,t)
    .catch(function(err){
      t.remove();
      addMsg('bot','⚠️ <strong>Error:</strong> '+esc((err&&err.message)||'server error'));
      showBanner('Single-command error. Coba lagi.');
      setStatus('error','off');
    })
    .finally(function(){busy=false;$('sendBtn').disabled=false;hidePause();abortCtrl=null;});
}
function sendAgent(){
  if(busy)return;
  var q=$('q').value.trim();
  if(!q)return;
  $('q').value='';autoGrow();hideHero();
  addMsg('user',esc(q));
  var t=typing();busy=true;$('sendBtn').disabled=true;showPause();setStatus('⚡ mengeksekusi — ikuti progres di bawah&hellip;');
  var box=document.createElement('div');box.className='bub';box.innerHTML='<strong>⚡ Langkah agen:</strong>';
  $('chatWrap').appendChild(box);
  streamRun('/api/agent',q,box,'⚙ eksekusi',false,t)
    .catch(function(err){
      t.remove();
      addMsg('bot','⚠️ <strong>Error:</strong> '+esc((err&&err.message)||'server error'));
      showBanner('Mode Coder error. Coba lagi.');
      setStatus('error','off');
    })
    .finally(function(){busy=false;$('sendBtn').disabled=false;hidePause();abortCtrl=null;});
}
function welcome(){
  var w=$('chatWrap');
  var bub='Halo! Saya agen AI <strong>Google Cloud</strong> — punya akses ke semua skill GCP (Cloud Run, BigQuery, Kubernetes, Security, dan lainnya).<br><br>📎 Bisa <strong>upload file</strong> (CSV, JSON, kode, log) atau <strong>gambar</strong> (paste/seret) untuk dianalisis.<br><br>Silakan tanya apa saja!';
  var m=document.createElement('div');m.className='msg bot';
  m.innerHTML='<div class="av">&#9729;&#65039;</div><div class="bub">'+bub+'</div>';
  w.appendChild(m);
}
document.getElementById('qbar').addEventListener('submit',function(e){e.preventDefault();send();});
var pz=$('pauseBtn');if(pz)pz.addEventListener('click',stopRun);
var mb=$('micBtn');if(mb)mb.addEventListener('click',toggleMic);
var vb=$('voiceChatBtn');if(vb)vb.addEventListener('click',toggleVoiceChat);
var kb=$('keyBtn');if(kb)kb.addEventListener('click',function(){verifyModal('🔑 Atur Kata Kunci Verifikasi','Simpan',function(w){LS('verifyWord',w);addMsg('bot','🔑 Kata kunci verifikasi diperbarui: '+esc(w));});});
document.querySelectorAll('.mode-btn').forEach(function(b){
  b.addEventListener('click',function(){setMode(b.dataset.mode);});
});
$('q').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
$('q').addEventListener('input',autoGrow);
$('attBtn').addEventListener('click',function(){$('fileInput').click();});
$('fileInput').addEventListener('change',function(){addFiles(this.files);this.value='';});
document.addEventListener('paste',function(e){
  var items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  var imgs=[];for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')===0){imgs.push(items[i].getAsFile());}}
  if(imgs.length)addFiles(imgs);
});
var dragN=0;
document.addEventListener('dragenter',function(e){e.preventDefault();dragN++;$('drop').classList.add('on');});
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('dragleave',function(e){e.preventDefault();if(--dragN<=0){dragN=0;$('drop').classList.remove('on');}});
document.addEventListener('drop',function(e){
  e.preventDefault();dragN=0;$('drop').classList.remove('on');
  if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);
});
document.querySelectorAll('.quick').forEach(function(qb){
  qb.addEventListener('click',function(){
    var fn=qb.dataset.fn;
    if(fn==='clarify'){askFollowup('Saya ingin mengklarifikasi maksud saya. Mohon tanyakan apa yang kurang jelas sebelum menjawab.');}
    else if(fn==='simplify'){askFollowup('Tolong jelaskan dengan bahasa sederhana, seakan saya pemula. Gunakan analogi jika perlu.');}
    else if(fn==='summary'){askFollowup('Ringkas topik utama dari jawaban terakhir menjadi poin-poin singkat.');}
    else if(fn==='example'){askFollowup('Berikan contoh nyata/implementasi untuk topik terakhir yang bisa langsung saya jalankan.');}
    else if(fn==='step'){askFollowup('Ubah jawaban terakhir menjadi langkah-langkah berurutan yang mudah diikuti.');}
    else if(fn==='deep'){askFollowup('Perdalam topik terakhir dengan detail teknis dan praktik terbaik.');}
  });
});
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click',function(){$('q').value=c.textContent;autoGrow();$('q').focus();});
});
var clearBtn=document.createElement('button');clearBtn.className='chip';clearBtn.textContent='🔄 Reset percakapan';
clearBtn.style.marginLeft='auto';
clearBtn.addEventListener('click',resetChat);
document.getElementById('chips').appendChild(clearBtn);
if(window.SpeechRecognition||window.webkitSpeechRecognition){initSpeech();}
document.querySelectorAll('#heroChips .chip').forEach(function(c){
  c.addEventListener('click',function(){heroSubmit(c.textContent);});
});
showHero();
fetch('/api/info').then(function(r){return r.json();}).then(function(d){
  setStatus('✅ '+d.skills+' skill · '+(d.model||'AI'));$('status').classList.add('on');
}).catch(function(){setStatus('offline','off');});
</script>
