name: CI Agen GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependensi
        working-directory: agen
        run: npm install

      - name: Cek sintaks kode
        working-directory: agen
        run: |
          node --check agent.js
          node --check server.js

      - name: Cek semua skill dimuat agen
        run: |
          node tools/generate-index.js "${{ github.repository }}" "${{ github.ref_name }}" index.json
          expected=$(find skills -name SKILL.md | wc -l)
          actual=$(node -e "console.log(require('./index.json').skills.length)")
          echo "Skill di repo: $expected, Skill di index.json: $actual"
          test "$expected" -eq "$actual"

      - name: Cek server.js membaca seluruh direktori skills
        working-directory: agen
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const SKILLS_DIR = path.resolve('..', 'skills');
            function findSkills(dir, out = []) {
              for (const name of fs.readdirSync(dir)) {
                const p = path.join(dir, name);
                if (fs.statSync(p).isDirectory()) findSkills(p, out);
                else if (name === 'SKILL.md') out.push(p);
              }
              return out;
            }
            const found = findSkills(SKILLS_DIR).length;
            const expected = fs.readdirSync(SKILLS_DIR).length ? found : 0;
            console.log('Skill terbaca server: ' + found);
            if (found === 0) process.exit(1);
          "
