name: CI Agen GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependensi
        working-directory: agen
        run: npm install

      - name: Cek sintaks kode
        working-directory: agen
        run: npm run check

      - name: Cek semua skill dimuat agen
        run: |
          node tools/generate-index.js "${{ github.repository }}" "${{ github.ref_name }}" index.json
          expected=$(find skills -name SKILL.md | wc -l)
          actual=$(node -e "console.log(require('./index.json').skills.length)")
          echo "Skill di repo: $expected, Skill di index.json: $actual"
          test "$expected" -eq "$actual"

      - name: Periksa konsistensi 4 sumber data (skills/index.json/packs.json/Capabilities.kt)
        run: node tools/verify.js --suite artifact
        env:
          VERIFY_STRICT: "1"

      - name: Verifikasi generator & katalog (arsitektur 1 generator utk semua kemampuan)
        run: node tools/generate-capabilities.js --check

      - name: Validasi arsitektur verifikasi terpadu (schema + pohon skill + word quality)
        run: node tools/verify.js --suite schema,tree,word --report verify-report.json

      - name: Uji server memuat seluruh skill
        working-directory: agen
        run: |
          GEMINI_API_KEY=dummy node -e "
            const app = require('./server.js');
            const server = app.listen(0, async () => {
              const port = server.address().port;
              const res = await fetch('http://127.0.0.1:' + port + '/api/skills');
              const body = await res.json();
              console.log('Skill terbaca server: ' + body.total);
              if (body.total === 0) process.exit(1);
              server.close();
            });
          "
