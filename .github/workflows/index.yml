name: Keluarkan Semua Skill (index.json)

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate index.json dari semua skill
        run: |
          node tools/generate-index.js "${{ github.repository }}" "${{ github.ref_name }}" index.json

      - name: Verifikasi semua skill masuk indeks
        run: |
          expected=$(find skills -name SKILL.md | wc -l)
          actual=$(node -e "console.log(require('./index.json').skills.length)")
          echo "Expected: $expected, Actual: $actual"
          test "$expected" -eq "$actual"

      - name: Commit index.json jika berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json up to date, tidak ada perubahan."
          else
            git commit -m "chore: regenerasi index.json (keluarkan semua skill)"
            git push
          fi
