name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore signing (otomatis, gratis tanpa secret)
        run: |
          cd android
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias gcpagent \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass gcpagent123 \
            -keypass gcpagent123 \
            -dname "CN=GCP Agent, OU=Dev, O=GCP Agent, L=Jakarta, S=DKI Jakarta, C=ID" 2>/dev/null
          printf 'storeFile=release.keystore\nstorePassword=gcpagent123\nkeyAlias=gcpagent\nkeyPassword=gcpagent123\n' > keystore.properties
          echo "keystore.properties dibuat"
          cat keystore.properties

      - name: Set up Gradle 8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK release (signed, siap install)
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Verifikasi APK release & ukuran
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          du -h android/app/build/outputs/apk/release/app-release.apk

      - name: Valida APK dengan apksigner (pastikan siap install)
        run: |
          ls $ANDROID_HOME/build-tools/
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify android/app/build/outputs/apk/release/app-release.apk && echo "APK VERIFIED OK"

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Rilis APK (siap install lewat release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "APK Agen GCP #${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/app-release.apk
