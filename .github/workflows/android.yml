name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.10.2"

jobs:
  # ====== 1. GATE KUALITAS: lint + compile penuh (tanpa sign) ======
  # Build Cache & dependency cache ON (gradle.properties + Setup Gradle):
  # dependency/artefak dipakai ulang antar run => build jauh lebih cepat tiap push.
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.vcode.outputs.value }}
      version_name: ${{ steps.vcode.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache dependency + build cache lintas run)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Analisis statik Android Lint (gate kualitas)
        working-directory: android
        run: gradle lintDebug --no-daemon

      - name: Kompilasi penuh debug (gate validitas)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Hitung versionCode & versionName otomatis (semver, naik tiap build)
        id: vcode
        run: |
          echo "value=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # ====== 2. RILIS PRODUKSI: APK + AAB (Play-ready) + checksum ======
  release:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Muat keystore signing dari secret (stabil, tanda tangan konsisten)
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.p12
          printf 'storeFile=keystore.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEYSTORE_PASSWORD }}" > android/keystore.properties
          echo "keystore.properties disiapkan (dari secret)"
          keytool -importkeystore -noprompt \
            -srckeystore android/keystore.p12 -srcstoretype PKCS12 \
            -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -destkeystore /tmp/verify.p12 -deststoretype PKCS12 \
            -deststorepass verify123 2>/dev/null
          echo "keystore terbaca: valid"

      - name: Set up Gradle (cache dependency + build cache lintas run)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK + AAB release (signed, R8, Play-ready)
        working-directory: android
        run: gradle assembleRelease bundleRelease -PversionCodeOverride=${{ needs.quality-gate.outputs.version_code }} -PversionNameOverride=${{ needs.quality-gate.outputs.version_name }} --no-daemon

      - name: Kumpulkan artefak & ukuran
        id: sizes
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" && echo "APK OK"
          test -f "$AAB" && echo "AAB OK"
          echo "apk_size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "aab_size=$(du -h "$AAB" | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$APK" "$AAB"

      - name: Validasi APK & signature (apksigner v2/v3)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          echo "APK VERIFIED OK"

      - name: Validasi AAB signature (jarsigner)
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          echo "AAB VERIFIED OK"

      - name: Hitung checksum SHA-256 APK & AAB
        run: |
          sha256sum \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            | tee android/checksums.txt

      - name: Upload artefak (APK + AAB + checksum)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/checksums.txt
          if-no-files-found: error

      - name: Buat changelog otomatis dari commit
        id: changelog
        run: |
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1 || true)
          if [ -n "$PREV" ]; then
            git log --oneline --no-merges "$PREV"..HEAD | sed 's/^/- /'
          else
            git log --oneline --no-merges -20 | sed 's/^/- /'
          fi | tee /tmp/changelog.txt
          echo "ok"

      - name: Rilis resmi (tag semver + APK + AAB + checksum + changelog)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.quality-gate.outputs.version_name }}
          name: "Agen GCP v${{ needs.quality-gate.outputs.version_name }}"
          generate_release_notes: false
          body: |
            **Agen GCP v${{ needs.quality-gate.outputs.version_name }}** — APK & bundle Android **native** (Jetpack Compose + Material 3).

            ## Artefak
            - **app-release.apk** — universal (semua ABI), langsung install: `${{ steps.sizes.outputs.apk_size }}`
            - **app-release.aab** — bundle Play-ready (Play Console): `${{ steps.sizes.outputs.aab_size }}`
            - **checksums.txt** — SHA-256 untuk verifikasi integritas

            ## Verifikasi
            - ✅ **apksigner**: signature **v2 + v3** valid, siap install
            - ✅ **jarsigner**: AAB terverifikasi
            - ✅ Android **Lint** bersih (quality gate)
            - ✅ Compile full debug pass
            - 🔒 **Signing stabil** dari GitHub secret (tanda tangan sama antar build)

            ## Fitur
            - 3 layar native: Beranda, Daftar Kemampuan (**39 gabungan**), Buka Agen
            - Tema gelap/terang, adaptive icon, splash, R8/ProGuard
            - versionCode `${{ needs.quality-gate.outputs.version_code }}` · semver `v${{ needs.quality-gate.outputs.version_name }}`

            ## Changelog
            $(cat /tmp/changelog.txt)

            _Verifikasi integritas: `sha256sum -c checksums.txt`_
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/checksums.txt
