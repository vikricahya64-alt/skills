name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK debug (ringan, tanpa bundel skill)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Verifikasi APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          du -h android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "APK Agen GCP #${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/app-debug.apk
