name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.10.2"

jobs:
  # ====== 1. GATE KUALITAS: lint + compile penuh (tanpa sign) ======
  # Build Cache & dependency cache ON (gradle.properties + Setup Gradle):
  # dependency/artefak dipakai ulang antar run => build jauh lebih cepat tiap push.
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.vcode.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache dependency + build cache lintas run)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Analisis statik Android Lint (gate kualitas)
        working-directory: android
        run: gradle lintDebug --no-daemon

      - name: Kompilasi penuh debug (gate validitas)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Hitung versionCode otomatis (naik tiap build)
        id: vcode
        run: echo "value=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # ====== 2. RILIS PRODUKSI: APK + AAB (Play-ready) + checksum ======
  release:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore signing (otomatis, gratis tanpa secret)
        run: |
          cd android
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias gcpagent \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass gcpagent123 \
            -keypass gcpagent123 \
            -dname "CN=GCP Agent, OU=Dev, O=GCP Agent, L=Jakarta, S=DKI Jakarta, C=ID" 2>/dev/null
          printf 'storeFile=release.keystore\nstorePassword=gcpagent123\nkeyAlias=gcpagent\nkeyPassword=gcpagent123\n' > keystore.properties
          echo "keystore.properties dibuat"

      - name: Set up Gradle (cache dependency + build cache lintas run)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK + AAB release (signed, R8, Play-ready)
        working-directory: android
        run: gradle assembleRelease bundleRelease -PversionCodeOverride=${{ needs.quality-gate.outputs.version_code }} --no-daemon

      - name: Kumpulkan artefak & ukuran
        id: sizes
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" && echo "APK OK"
          test -f "$AAB" && echo "AAB OK"
          echo "apk_size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "aab_size=$(du -h "$AAB" | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$APK" "$AAB"

      - name: Validasi APK & signature (apksigner v2/v3)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          echo "APK VERIFIED OK"

      - name: Validasi AAB signature (jarsigner)
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          echo "AAB VERIFIED OK"

      - name: Hitung checksum SHA-256 APK & AAB
        run: |
          sha256sum \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            | tee android/checksums.txt

      - name: Upload artefak (APK + AAB + checksum)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/checksums.txt
          if-no-files-found: error

      - name: Rilis resmi (APK + AAB + checksum, siap upgrade)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Agen GCP v1.0.0 (build #${{ github.run_number }})"
          generate_release_notes: false
          body: |
            **Agen GCP v1.0.0** — APK & bundle Android **native** (Jetpack Compose + Material 3).

            ## Artefak
            - **app-release.apk** — universal (semua ABI), langsung install: `${{ steps.sizes.outputs.apk_size }}`
            - **app-release.aab** — bundle Play-ready (Play Console): `${{ steps.sizes.outputs.aab_size }}`
            - **checksums.txt** — SHA-256 untuk verifikasi integritas

            ## Verifikasi
            - ✅ **apksigner**: signature **v2 + v3** valid, siap install
            - ✅ **jarsigner**: AAB terverifikasi
            - ✅ Android **Lint** bersih (quality gate)
            - ✅ Compile full debug pass

            ## Fitur
            - 3 layar native: Beranda, Daftar Kemampuan (**39 gabungan**), Buka Agen
            - Tema gelap/terang, adaptive icon, splash, R8/ProGuard
            - versionCode `${{ needs.quality-gate.outputs.version_code }}` (naik otomatis tiap build)

            _Keystore dibuat per-build di CI (bukan secret). Verifikasi integritas:
            `sha256sum -c checksums.txt`_
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/checksums.txt
