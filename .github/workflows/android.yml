name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.10.2"

jobs:
  # ====== 1. GATE KUALITAS: lint + compile penuh (tanpa sign) ======
  # Build Cache & dependency cache ON (gradle.properties + Setup Gradle):
  # dependency/artefak dipakai ulang antar run => build jauh lebih cepat tiap push.
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.vcode.outputs.value }}
      version_name: ${{ steps.vcode.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache dependency + build cache lintas run)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Analisis statik Android Lint (gate kualitas)
        working-directory: android
        run: gradle lintDebug --no-daemon

      - name: Kompilasi penuh debug (gate validitas)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Hitung versionCode & versionName otomatis (semver, naik tiap build)
        id: vcode
        run: |
          echo "value=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # ====== 1b. UJI JALANKAN DI EMULATOR AWAN (app benar-benar dibuka, bukan sekadar compile) ======
  # Job ini INFO/bukan gate: kalau emulator cloud gagal/flaky, pipeline tetap hijau
  # (continue-on-error) dan tidak pernah menggantung / menahan run lama.
  device-smoke:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cache dependency + build cache lintas run)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # APK debug dibangun SEBELUM emulator diluncurkan, agar action emulator
      # hanya melakukan install+launch. Ini menurunkan tekanan memori puncak
      # (build + emulator berjalan bersamaan sering bikin PackageManager gagal
      # mendaftarkan paket meski adb install bilang "Success").
      - name: Bangun APK debug dulu (di luar emulator)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Jalankan app di emulator Android (smoke test nyata)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 28 default (AOSP) jauh lebih ringan & cepat boot-nya di CI tanpa
          # akselerasi hardware, lebih andal untuk smoke test.
          api-level: 28
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Catatan: action menjalankan tiap baris script sebagai `sh -c` tersendiri,
          # jadi `cd` antarbaris tidak bertahan. Setiap baris dibuat mandiri.
          # Semua perintah adb di-pin ke emulator-5554 + dibungkus `timeout` agar
          # TIDAK ADA yang bisa menggantung berjam-jam. Install pakai push+pm install
          # (lebih andal daripada streamed `adb install` di emulator CI yang lambat).
          script: |
            timeout 30 adb devices
            timeout 60 adb -s emulator-5554 shell pm path com.vikri.gcpagent >/dev/null 2>&1
            timeout 60 adb -s emulator-5554 push android/app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/app.apk
            for i in 1 2 3 4 5; do timeout 60 adb -s emulator-5554 shell pm path com.vikri.gcpagent >/dev/null 2>&1 && break; timeout 90 adb -s emulator-5554 shell pm install -r -t /data/local/tmp/app.apk; sleep 3; done
            timeout 60 adb -s emulator-5554 shell pm path com.vikri.gcpagent || (echo "APP NOT INSTALLED"; exit 1)
            timeout 60 adb -s emulator-5554 shell am start -W -n com.vikri.gcpagent/.MainActivity
            for i in $(seq 1 8); do pid=$(timeout 30 adb -s emulator-5554 shell pidof com.vikri.gcpagent 2>/dev/null | tr -d '\r'); [ -n "$pid" ] && { echo "APP LAUNCHED OK (pid=$pid)"; break; }; sleep 5; done
            timeout 30 adb -s emulator-5554 shell pidof com.vikri.gcpagent >/dev/null 2>&1 && echo "APP RUNNING OK" || (echo "APP NOT RUNNING"; exit 1)
            echo "=== Current focus ==="
            timeout 30 adb -s emulator-5554 shell dumpsys window 2>/dev/null | grep -E "mCurrentFocus|mFocusedApp" || true
            echo "=== Crash check (logcat) ==="
            adb -s emulator-5554 logcat -d | grep -iE "FATAL EXCEPTION|AndroidRuntime.*FATAL" | head -20 || true

  # ====== 2. RILIS PRODUKSI: APK + AAB (Play-ready) + checksum ======
  release:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Muat keystore signing dari secret (stabil, tanda tangan konsisten)
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.p12
          printf 'storeFile=keystore.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEYSTORE_PASSWORD }}" > android/keystore.properties
          echo "keystore.properties disiapkan (dari secret)"
          keytool -importkeystore -noprompt \
            -srckeystore android/keystore.p12 -srcstoretype PKCS12 \
            -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -destkeystore /tmp/verify.p12 -deststoretype PKCS12 \
            -deststorepass verify123 2>/dev/null
          echo "keystore terbaca: valid"

      - name: Set up Gradle (cache dependency + build cache lintas run)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK + AAB release (signed, R8, Play-ready)
        working-directory: android
        run: gradle assembleRelease bundleRelease -PversionCodeOverride=${{ needs.quality-gate.outputs.version_code }} -PversionNameOverride=${{ needs.quality-gate.outputs.version_name }} --no-daemon

      - name: Kumpulkan artefak & ukuran
        id: sizes
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" && echo "APK OK"
          test -f "$AAB" && echo "AAB OK"
          echo "apk_size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "aab_size=$(du -h "$AAB" | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$APK" "$AAB"

      - name: Validasi APK & signature (apksigner v2/v3)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          echo "APK VERIFIED OK"

      - name: Validasi AAB signature (jarsigner)
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          echo "AAB VERIFIED OK"

      - name: Hitung checksum SHA-256 APK & AAB
        run: |
          sha256sum \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            | tee android/checksums.txt

      - name: Bangun APK dari AAB (bukti AAB berfungsi & distribusi Play)
        run: |
          curl -fsSL -o /tmp/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          mkdir -p /tmp/from-aab
          # APK universal (gabung semua ABI) — bisa di-install langsung
          java -jar /tmp/bundletool.jar build-apks \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output=/tmp/from-aab/universal.apks \
            --ks=android/keystore.p12 --ks-pass=pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.KEY_ALIAS }} --key-pass=pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --mode=universal
          unzip -o -q /tmp/from-aab/universal.apks -d /tmp/from-aab/universal
          cp /tmp/from-aab/universal/universal.apk android/app-release-universal-from-aab.apk
          echo "=== universal.apk ==="
          ls -la android/app-release-universal-from-aab.apk

      - name: Verifikasi APK hasil AAB + checksum
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify android/app-release-universal-from-aab.apk
          echo "UNIVERSAL-FROM-AAB VERIFIED OK"
          sha256sum android/app-release-universal-from-aab.apk >> android/checksums.txt
          sed -i 's#android/app/build/outputs/apk/release/app-release.apk#app-release.apk#; s#android/app/build/outputs/bundle/release/app-release.aab#app-release.aab#; s#android/app-release-universal-from-aab.apk#app-release-universal-from-aab.apk#' android/checksums.txt
          cat android/checksums.txt

      - name: Upload artefak (APK + AAB + universal-from-AAB + checksum)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app-release-universal-from-aab.apk
            android/checksums.txt
          if-no-files-found: error

      - name: Buat changelog otomatis dari commit
        id: changelog
        run: |
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1 || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --oneline --no-merges "$PREV"..HEAD | sed 's/^/- /')
          else
            LOG=$(git log --oneline --no-merges -20 | sed 's/^/- /')
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" | tee /tmp/changelog.txt

      - name: Rilis resmi (tag semver + APK + AAB + checksum + changelog)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.quality-gate.outputs.version_name }}
          name: "Agen GCP v${{ needs.quality-gate.outputs.version_name }}"
          generate_release_notes: false
          body: |
            **Agen GCP v${{ needs.quality-gate.outputs.version_name }}** — APK & bundle Android **native** (Jetpack Compose + Material 3).

            ## Artefak
            - **app-release.apk** — universal (semua ABI), langsung install: `${{ steps.sizes.outputs.apk_size }}`
            - **app-release.aab** — bundle Play-ready (Play Console): `${{ steps.sizes.outputs.aab_size }}`
            - **app-release-universal-from-aab.apk** — APK hasil bundletool dari AAB (bukti AAB berfungsi)
            - **checksums.txt** — SHA-256 untuk verifikasi integritas

            ## Verifikasi
            - ✅ **apksigner**: signature **v2 + v3** valid, siap install
            - ✅ **jarsigner**: AAB terverifikasi
            - ✅ **bundletool**: APK universal berhasil dibangun & diverifikasi dari AAB
            - ✅ Android **Lint** bersih (quality gate) + **build** terbukti (APK/AAB)
            - 🔒 **Signing stabil** dari GitHub secret + keamanan produksi (backup rules, HTTPS-only)
            - 📱 **Smoke test emulator** (info, non-blocking): app dijalankan di emulator cloud AOSP API 28

            ## Fitur
            - 3 layar native: Beranda, Daftar Kemampuan (**39 gabungan**), Buka Agen
            - Tema gelap/terang, adaptive icon, splash, R8/ProGuard
            - versionCode `${{ needs.quality-gate.outputs.version_code }}` · semver `v${{ needs.quality-gate.outputs.version_name }}`

            ## Changelog
            ${{ steps.changelog.outputs.changelog }}

            _Verifikasi integritas: `sha256sum -c checksums.txt`_
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app-release-universal-from-aab.apk
            android/checksums.txt

  # ====== 3. PUBLISH KE PLAY CONSOLE (opsional — aktif jika secret ada) ======
  # Tambahkan secret PLAY_SERVICE_ACCOUNT_JSON (isi JSON service account Play)
  # + atur package_name di bawah, maka tiap build otomatis diupload ke track ALPHA.
  # Catatan: `secrets` tidak boleh dipakai di if → deteksi dulu via run & env,
  # lalu gate step publikasi memakai output (tanpa menyebut secret di if).
  play-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deteksi ketersediaan secret Play
        id: detect
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "has=yes" >> "$GITHUB_OUTPUT"
            echo "Secret Play tersedia → akan publish"
          else
            echo "has=no" >> "$GITHUB_OUTPUT"
            echo "Secret Play belum disiapkan → publish dilewati"
          fi

      - name: Unduh AAB resmi dari Release
        if: steps.detect.outputs.has == 'yes'
        run: |
          gh release download "v${{ needs.quality-gate.outputs.version_name }}" \
            --repo vikricahya64-alt/skills \
            --pattern "app-release.aab" --dir /tmp
          ls -la /tmp/app-release.aab

      - name: Upload AAB ke Play Console (track ALPHA)
        if: steps.detect.outputs.has == 'yes'
        uses: r0adkll/upload-google-play@v1
        with:
          service_account_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          package_name: com.vikri.gcpagent
          release_files: /tmp/app-release.aab
          track: alpha
          status: completed
